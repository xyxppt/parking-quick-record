<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一鍵記車位</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 400px; margin: auto; }
        h2 { text-align: center; color: #4CAF50; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; }
        .btn-save { background: #4CAF50; color: white; }
        .btn-nav { background: #2196F3; color: white; }
        .floor-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .floor-btn { padding: 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; font-size: 14px; }
        .floor-btn.active { background: #4CAF50; border-color: #4CAF50; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; margin-top: 5px; }
        #status { text-align: center; font-size: 14px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>🚗 極速記車位</h2>

    <div class="card">
        <label>選擇樓層 / 區域：</label>
        <div class="floor-grid" id="floorGrid">
            <button class="floor-btn" onclick="setFloor('B3')">B3</button>
            <button class="floor-btn" onclick="setFloor('B2')">B2</button>
            <button class="floor-btn" onclick="setFloor('B1')">B1</button>
            <button class="floor-btn" onclick="setFloor('1F')">1F</button>
        </div>
        <input type="text" id="noteInput" placeholder="備註（例如：柱子編號 B-12、靠電梯）" style="margin-top: 12px;">
    </div>

    <button class="btn-save" onclick="saveLocation()">📍 記錄目前位置</button>
    <div id="status">尚未記錄</div>

    <div class="card" style="margin-top: 20px;">
        <h3>上次停放資訊</h3>
        <p id="savedInfo">無紀錄</p>
        <button class="btn-nav" onclick="openNav()">🗺️ 導航回車上</button>
    </div>

<script>
    let selectedFloor = "B1";
    let currentLat = null;
    let currentLng = null;

    function setFloor(floor) {
        selectedFloor = floor;
        document.querySelectorAll('.floor-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText === floor);
        });
    }

    function saveLocation() {
        const status = document.getElementById('status');
        status.innerText = "正在取得 GPS...";
        
        if (!navigator.geolocation) {
            status.innerText = "您的瀏覽器不支援定位";
            return;
        }

        navigator.geolocation.getCurrentPosition(position => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            const note = document.getElementById('noteInput').value;
            const time = new Date().toLocaleTimeString();

            const data = { lat: currentLat, lng: currentLng, floor: selectedFloor, note: note, time: time };
            localStorage.setItem('parking_loc', JSON.stringify(data));

            updateDisplay(data);
            status.innerText = "✅ 記錄成功！";
        }, error => {
            status.innerText = "❌ 定位失敗，請檢查權限";
        }, { enableHighAccuracy: true, timeout: 5000 });
    }

    function loadSaved() {
        const saved = localStorage.getItem('parking_loc');
        if (saved) {
            updateDisplay(JSON.parse(saved));
        }
    }

    function updateDisplay(data) {
        currentLat = data.lat;
        currentLng = data.lng;
        document.getElementById('savedInfo').innerHTML = `
            <b>樓層：</b>${data.floor}<br>
            <b>備註：</b>${data.note || '無'}<br>
            <b>時間：</b>${data.time}
        `;
    }

    function openNav() {
        if (!currentLat || !currentLng) {
            alert("找不到紀錄的座標！");
            return;
        }
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${currentLat},${currentLng}`, '_blank');
    }

    loadSaved();
</script>
</body>
</html>
