<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>極速記車位 2.2 智能升級版</title>

<style>
:root {
  --bg: #10151f;
  --card: #1b2534;
  --border: #344256;
  --field: #111a27;
  --field-border: #405069;
  --text: #f3f6fb;
  --muted: #aab7c8;
  --accent: #35d6a1;
  --accent-ink: #082c21;
  --warn: #ffcc66;
  --err: #ff9999;
  --radius: 16px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0 auto;
  padding: 18px 14px calc(35px + env(safe-area-inset-bottom));
  max-width: 480px;
  min-height: 100vh;
  background: #10151f;
  background: var(--bg);
  color: #f3f6fb;
  color: var(--text);
  font-family: Arial, "Noto Sans TC", "PingFang TC", sans-serif;
  overscroll-behavior-y: contain;
}

header { text-align: center; padding: 12px 0 22px; }
header .logo { font-size: 42px; line-height: 1; }
h1 { margin: 6px 0 4px; font-size: 26px; letter-spacing: .5px; }
h2 { font-size: 17px; margin: 0 0 16px; }

.card {
  background: #1b2534;
  background: var(--card);
  border: 1px solid #344256;
  border-color: var(--border);
  border-radius: 16px;
  border-radius: var(--radius);
  padding: 17px;
  margin-bottom: 15px;
}

label {
  display: block;
  color: #aab7c8;
  color: var(--muted);
  font-size: 13px;
  margin: 12px 0 7px;
}

input[type="text"] {
  width: 100%;
  padding: 12px;
  min-height: 46px;
  color: #fff;
  background: #111a27;
  background: var(--field);
  border: 1px solid #405069;
  border-color: var(--field-border);
  border-radius: 9px;
  font-size: 16px;
  font-family: inherit;
}

input[type="text"]::placeholder { color: #66788f; }

button {
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  min-height: 46px;
  padding: 11px 8px;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: filter .15s, transform .08s;
}

button:active:not(:disabled) { filter: brightness(.82); transform: scale(.985); }
button:disabled { opacity: .5; cursor: not-allowed; }

button:focus-visible,
input:focus-visible {
  outline: 2px solid #35d6a1;
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.floor-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.floor-btn {
  color: #fff;
  background: #303d50;
  border: 1px solid #43516a;
}

.floor-btn.active {
  color: #8affd8;
  background: #125340;
  border-color: #35d6a1;
  border-color: var(--accent);
}

.primary { width: 100%; background: #35d6a1; background: var(--accent); color: #082c21; color: var(--accent-ink); }
.secondary { width: 100%; background: #1c3c5e; color: #b8dcff; margin-top: 9px; }
.danger { width: 100%; background: #472831; color: #ffc2c2; margin-top: 9px; }

#status {
  min-height: 42px;
  padding: 10px 2px 0;
  text-align: center;
  color: #aab7c8;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.good { color: #73f1c3 !important; }
.error { color: #ff9999 !important; color: var(--err) !important; }
.warning { color: #ffcc66 !important; color: var(--warn) !important; }

.info {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #344256;
  border-bottom-color: var(--border);
  font-size: 14px;
}
.info:last-of-type { border-bottom: 0; }
.info span:first-child { color: #aab7c8; color: var(--muted); flex-shrink: 0; }
.info span:last-child { text-align: right; overflow-wrap: anywhere; }

.small { color: #aab7c8; color: var(--muted); font-size: 12px; line-height: 1.8; }

#photoPreview, #savedPhoto {
  display: none;
  width: 100%;
  max-height: 260px;
  object-fit: contain;
  margin-top: 12px;
  border-radius: 10px;
  background: #111a27;
  background: var(--field);
}

.compass {
  width: 190px;
  height: 190px;
  border: 2px solid #405069;
  border-color: var(--field-border);
  border-radius: 50%;
  margin: 15px auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 40%, #16202f, #0d141d);
  position: relative;
  overflow: hidden;
}

#arrow {
  font-size: 68px;
  color: #35d6a1;
  color: var(--accent);
  line-height: 1.15;
  transition: transform .25s ease-out;
  will-change: transform;
}

#distance { font-size: 23px; font-weight: bold; }
#bearing { font-size: 12px; color: #aab7c8; color: var(--muted); margin-top: 5px; padding: 0 12px; text-align: center; }

.mode-badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 10px;
  background: #233248;
  color: #35d6a1;
  color: var(--accent);
  border: 1px solid #35d6a1;
  border-color: var(--accent);
  transition: color .2s, border-color .2s;
}

footer { text-align: center; color: #78879a; font-size: 11px; line-height: 1.8; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

<body>

<header>
  <div class="logo" aria-hidden="true">🚗</div>
  <h1>極速記車位</h1>
  <p class="small">2.2 智能導航升級版｜室內與室外雙模尋車助手</p>
</header>

<section class="card">
  <h2>📍 記錄停車位置</h2>

  <label id="floorLabel">選擇樓層</label>
  <div class="floor-grid" id="floorGrid" role="group" aria-labelledby="floorLabel">
    <button type="button" class="floor-btn" data-floor="B4" aria-pressed="false">B4</button>
    <button type="button" class="floor-btn" data-floor="B3" aria-pressed="false">B3</button>
    <button type="button" class="floor-btn" data-floor="B2" aria-pressed="false">B2</button>
    <button type="button" class="floor-btn active" data-floor="B1" aria-pressed="true">B1</button>
    <button type="button" class="floor-btn" data-floor="1F" aria-pressed="false">1F</button>
    <button type="button" class="floor-btn" data-floor="2F" aria-pressed="false">2F</button>
    <button type="button" class="floor-btn" data-floor="3F" aria-pressed="false">3F</button>
    <button type="button" class="floor-btn" data-floor="其他" aria-pressed="false">其他</button>
  </div>

  <label for="zone">區域或車位號碼</label>
  <input id="zone" type="text" maxlength="100" autocomplete="off"
         placeholder="例如：C區、C12、P3-128">

  <label for="note">備註</label>
  <input id="note" type="text" maxlength="200" autocomplete="off"
         placeholder="例如：電梯旁、靠近柱子柱號 B-12">

  <label for="photo">拍攝車位照片（建議必填）</label>
  <input id="photo" type="file" accept="image/*" capture="environment">

  <img id="photoPreview" alt="照片預覽">

  <button type="button" class="primary" id="saveBtn" style="margin-top:16px">
    📍 記錄目前位置
  </button>

  <div id="status" role="status" aria-live="polite">
    程式已載入，請選擇樓層並記錄車位。
  </div>
</section>

<section class="card">
  <h2>🧭 智慧尋車導航</h2>

  <div style="text-align:center;">
    <span id="navModeBadge" class="mode-badge">模式：尚未記錄車位</span>
  </div>

  <div class="compass" id="compassContainer">
    <div id="arrow" aria-hidden="true">↑</div>
    <div id="distance">--</div>
    <div id="bearing">尚未開始導航</div>
  </div>

  <button type="button" class="secondary" id="iosPermBtn"
          style="display:none; margin-bottom:9px;">
    🔓 啟用手機指南針權限 (iOS)
  </button>

  <button type="button" class="primary" id="startBtn">
    🧭 開始導航 / 取得即時位置
  </button>

  <button type="button" class="secondary" id="stopBtn">
    停止定位
  </button>

  <p id="navStatus" class="small" style="margin-top:10px;">
    請先記錄位置，再開始導航。
  </p>
</section>

<section class="card">
  <h2>🅿️ 上次停車紀錄</h2>

  <div id="empty" class="small">目前沒有紀錄。</div>

  <div id="savedPanel" hidden>
    <div class="info"><span>樓層</span><span id="sFloor"></span></div>
    <div class="info"><span>區域／車位</span><span id="sZone"></span></div>
    <div class="info"><span>備註</span><span id="sNote"></span></div>
    <div class="info"><span>時間</span><span id="sTime"></span></div>
    <div class="info"><span>GPS 狀態</span><span id="sAccuracy"></span></div>

    <img id="savedPhoto" alt="停車照片">

    <button type="button" class="secondary" id="mapsBtn">
      🗺️ Google Maps 戶外導航
    </button>

    <button type="button" class="secondary" id="copyBtn">
      📋 複製紀錄
    </button>

    <button type="button" class="danger" id="clearBtn">
      🗑️ 清除紀錄
    </button>
  </div>
</section>

<footer>
  紀錄儲存在目前瀏覽器中。<br>
  地下室將自動切換為室內地標與照片指引模式。
</footer>

<script>
(function () {
  "use strict";

  /* =========================================================
     全域錯誤顯示（方便排查：有任何錯誤會直接顯示在畫面底部）
     ========================================================= */
  function showFatal(msg) {
    try {
      var box = document.getElementById("__err");
      if (!box) {
        box = document.createElement("div");
        box.id = "__err";
        box.style.cssText =
          "position:fixed;left:10px;right:10px;bottom:10px;z-index:99999;" +
          "background:#5a1e28;color:#ffd7d7;padding:12px 14px;border-radius:12px;" +
          "font-size:13px;line-height:1.6;box-shadow:0 6px 20px rgba(0,0,0,.5);" +
          "word-break:break-all;";
        (document.body || document.documentElement).appendChild(box);
      }
      box.textContent = "⚠️ 程式錯誤：" + msg;
    } catch (e) { /* 忽略 */ }
  }

  window.addEventListener("error", function (e) {
    showFatal((e && e.message) ? e.message : "未知錯誤");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e && e.reason;
    showFatal((r && r.message) ? r.message : String(r || "未處理的非同步錯誤"));
  });

  /* =========================================================
     小工具
     ========================================================= */
  function $(id) { return document.getElementById(id); }

  function each(list, fn) {
    if (!list) return;
    if (typeof list.forEach === "function") { list.forEach(fn); return; }
    for (var i = 0; i < list.length; i++) fn(list[i], i);
  }

  function isNum(v) {
    return typeof v === "number" && isFinite(v);
  }

  function shallowCopy(obj, overrides) {
    var out = {}, k;
    for (k in obj) { if (Object.prototype.hasOwnProperty.call(obj, k)) out[k] = obj[k]; }
    for (k in overrides) { if (Object.prototype.hasOwnProperty.call(overrides, k)) out[k] = overrides[k]; }
    return out;
  }

  /* =========================================================
     主程式（包在 try 裡，確保任何錯誤都能被看見）
     ========================================================= */
  try {
    main();
  } catch (err) {
    showFatal((err && err.message) ? err.message : String(err));
  }

  function main() {

    /* ---------- 常數 ---------- */
    var KEY = "parking_v22";
    var LEGACY_KEYS = ["parking_v21", "parking_v3", "parking_loc"];
    var MAX_PHOTO_DIM = 1024;
    var PHOTO_QUALITY = 0.72;
    var MAX_FILE_SIZE = 15 * 1024 * 1024;
    var NEAR_THRESHOLD = 8;

    /* ---------- 狀態 ---------- */
    var floor = "B1";
    var saved = null;
    var current = null;
    var heading = null;
    var watchId = null;
    var photoData = "";
    var busy = false;
    var arrowRotation = 0;
    var listeningOrientation = false;

    /* ---------- 訊息 ---------- */
    function say(message, type) {
      var el = $("status");
      if (!el) return;
      el.textContent = message;
      el.className = type || "";
    }

    function sayNav(message, type) {
      var el = $("navStatus");
      if (!el) return;
      el.textContent = message;
      el.className = "small " + (type || "");
    }

    function buzz(pattern) {
      try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* 忽略 */ }
    }

    /* ---------- 樓層 ---------- */
    function chooseFloor(value, silent) {
      floor = value;
      var buttons = document.querySelectorAll(".floor-btn");
      each(buttons, function (btn) {
        var active = btn.getAttribute("data-floor") === value;
        if (active) { btn.classList.add("active"); }
        else { btn.classList.remove("active"); }
        btn.setAttribute("aria-pressed", active ? "true" : "false");
      });
      if (!silent) say("目前選擇樓層：" + value, "good");
    }

    each(document.querySelectorAll(".floor-btn"), function (btn) {
      btn.addEventListener("click", function () {
        chooseFloor(btn.getAttribute("data-floor"));
      });
    });

    /* ---------- 幾何 / 判斷 ---------- */
    function validPoint(data) {
      return !!data &&
        isNum(data.lat) && isNum(data.lng) &&
        Math.abs(data.lat) <= 90 && Math.abs(data.lng) <= 180;
    }

    function isBasement(f) {
      return typeof f === "string" && /^B/i.test(f);
    }

    function isIndoorMode() {
      if (!saved) return true;
      if (isBasement(saved.floor)) return true;
      if (!validPoint(saved)) return true;
      if (isNum(saved.accuracy) && saved.accuracy > 50) return true;
      return false;
    }

    /* ---------- 儲存 ---------- */
    function persist(data) {
      try {
        localStorage.setItem(KEY, JSON.stringify(data));
        saved = data;
        return data;
      } catch (error) {
        if (data.photo) {
          var slim = shallowCopy(data, { photo: "" });
          try {
            localStorage.setItem(KEY, JSON.stringify(slim));
            saved = slim;
            say("照片過大無法儲存，已保留文字紀錄。", "warning");
            return slim;
          } catch (e2) { /* 繼續往下 */ }
        }
        say("儲存失敗：瀏覽器空間不足或處於隱私模式。", "error");
        return null;
      }
    }

    /* ---------- 模式徽章 ---------- */
    function updateNavModeUI() {
      var badge = $("navModeBadge");
      var arrow = $("arrow");
      if (!badge || !arrow) return;

      if (!saved) {
        badge.textContent = "模式：尚未記錄車位";
        badge.style.color = "";
        badge.style.borderColor = "";
        arrow.textContent = "↑";
        return;
      }

      if (isIndoorMode()) {
        badge.textContent = "🏠 室內地標與照片指引模式（防誤導）";
        badge.style.color = "#ffcc66";
        badge.style.borderColor = "#ffcc66";
        arrow.textContent = "🅿️";
        arrow.style.transform = "none";
        arrowRotation = 0;
        var b = $("bearing");
        if (b) b.textContent = "地下室請依樓層與照片尋車";
      } else {
        badge.textContent = "🛰️ GPS 戶外直線導航模式";
        badge.style.color = "#35d6a1";
        badge.style.borderColor = "#35d6a1";
        arrow.textContent = "↑";
      }
    }

    /* ---------- 渲染上次紀錄 ---------- */
    function render(data) {
      saved = data;

      var empty = $("empty");
      var panel = $("savedPanel");
      if (empty) empty.hidden = true;
      if (panel) panel.hidden = false;

      $("sFloor").textContent = data.floor || "未知";
      $("sZone").textContent = data.zone || "未填寫";
      $("sNote").textContent = data.note || "無";
      $("sTime").textContent = data.timestamp
        ? new Date(data.timestamp).toLocaleString("zh-TW")
        : (data.time || "未知");

      if (validPoint(data)) {
        var acc = Math.round(data.accuracy || 0);
        var level = acc < 15 ? "高精度" : (acc < 50 ? "中精度" : "低精度（建議核對照片）");
        $("sAccuracy").textContent = "約 " + acc + " 公尺（" + level + "）";
      } else {
        $("sAccuracy").textContent = "無 GPS 座標（純室內紀錄）";
      }

      var photoEl = $("savedPhoto");
      if (data.photo) {
        photoEl.src = data.photo;
        photoEl.style.display = "block";
      } else {
        photoEl.removeAttribute("src");
        photoEl.style.display = "none";
      }

      $("zone").value = data.zone || "";
      $("note").value = data.note || "";

      chooseFloor(data.floor || "B1", true);
      updateNavModeUI();
    }

    /* ---------- 讀取舊資料 ---------- */
    function loadSaved() {
      var raw = null;
      try {
        raw = localStorage.getItem(KEY);
        if (!raw) {
          for (var i = 0; i < LEGACY_KEYS.length; i++) {
            raw = localStorage.getItem(LEGACY_KEYS[i]);
            if (raw) break;
          }
        }
      } catch (e) {
        say("無法存取瀏覽器儲存空間。", "error");
        return;
      }
      if (!raw) return;

      try {
        var data = JSON.parse(raw);
        data.floor = String(data.floor || "B1");
        data.zone = String(data.zone || "");
        data.note = String(data.note || "");
        data.photo = typeof data.photo === "string" ? data.photo : "";
        if (!isNum(data.lat)) data.lat = null;
        if (!isNum(data.lng)) data.lng = null;

        render(data);
        say("已載入上次停車紀錄。", "good");
      } catch (error) {
        say("舊紀錄格式無法讀取，請重新記錄。", "warning");
      }
    }

    /* ---------- 照片壓縮 ---------- */
    function compressImage(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();

        reader.onload = function () {
          var img = new Image();

          img.onload = function () {
            try {
              var w = img.naturalWidth || img.width;
              var h = img.naturalHeight || img.height;
              if (!w || !h) { reject(new Error("圖片尺寸無效")); return; }

              var scale = Math.min(1, MAX_PHOTO_DIM / Math.max(w, h));
              var tw = Math.max(1, Math.round(w * scale));
              var th = Math.max(1, Math.round(h * scale));

              var canvas = document.createElement("canvas");
              canvas.width = tw;
              canvas.height = th;

              var ctx = canvas.getContext("2d");
              ctx.fillStyle = "#ffffff";
              ctx.fillRect(0, 0, tw, th);
              ctx.drawImage(img, 0, 0, tw, th);

              resolve(canvas.toDataURL("image/jpeg", PHOTO_QUALITY));
            } catch (err) {
              reject(err);
            }
          };

          img.onerror = function () { reject(new Error("圖片解析失敗")); };
          img.src = reader.result;
        };

        reader.onerror = function () { reject(new Error("檔案讀取失敗")); };
        reader.readAsDataURL(file);
      });
    }

    $("photo").addEventListener("change", function (event) {
      var file = event.target.files && event.target.files[0];
      if (!file) return;

      if (!file.type || file.type.indexOf("image/") !== 0) {
        say("請選擇有效的圖片檔。", "error");
        event.target.value = "";
        return;
      }
      if (file.size > MAX_FILE_SIZE) {
        say("照片太大，請選擇 15 MB 以下的圖片。", "error");
        event.target.value = "";
        return;
      }

      say("正在處理照片……");

      compressImage(file).then(function (dataUrl) {
        photoData = dataUrl;
        var pv = $("photoPreview");
        pv.src = dataUrl;
        pv.style.display = "block";
        var kb = Math.round(dataUrl.length * 0.75 / 1024);
        say("照片已壓縮完成（約 " + kb + " KB）。", "good");
      }).catch(function (err) {
        say("照片處理失敗：" + err.message, "error");
        event.target.value = "";
      });
    });

    /* ---------- 儲存紀錄 ---------- */
    function saveRecord(position) {
      var now = Date.now();
      var prev = saved || {};
      var hasFix = !!position;

      var lat = hasFix ? position.coords.latitude : null;
      var lng = hasFix ? position.coords.longitude : null;
      var acc = hasFix ? position.coords.accuracy : null;

      /* 沒拿到新座標但樓層沒變 → 沿用舊座標（單純更新備註的情況） */
      if (!hasFix && validPoint(prev) && prev.floor === floor) {
        lat = prev.lat; lng = prev.lng; acc = prev.accuracy;
      }

      var data = {
        lat: lat,
        lng: lng,
        accuracy: acc,
        floor: floor,
        zone: $("zone").value.trim(),
        note: $("note").value.trim(),
        timestamp: now,
        time: new Date(now).toLocaleString("zh-TW"),
        photo: photoData || prev.photo || ""
      };

      var stored = persist(data);
      if (!stored) return;

      render(stored);
      buzz([30, 40, 30]);
