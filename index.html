<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121212">
<title>一鍵記車位</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --field: #2a2a2a;
    --line: #3a3a3a;
    --text: #f2f2f2;
    --muted: #9e9e9e;
    --green: #4caf50;
    --blue: #2196f3;
    --amber: #ffb300;
    --red: #ef5350;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0 auto;
    max-width: 420px;
    min-height: 100vh;
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }

  .title {
    margin: 0 0 16px;
    font-size: 22px;
    text-align: center;
    color: var(--green);
    letter-spacing: .5px;
  }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
  }

  .card-title {
    margin: 0 0 10px;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
  }

  .label { margin: 0 0 8px; font-size: 14px; color: var(--muted); }

  .floor-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .floor-btn {
    padding: 12px 4px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 9px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .15s, border-color .15s, color .15s;
  }
  .floor-btn:hover { border-color: #555; }
  .floor-btn.active {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  .floor-grid + .label { margin-top: 14px; }

  input[type="text"] {
    width: 100%;
    margin-top: 8px;
    padding: 12px 14px;
    font: inherit;
    font-size: 16px;          /* 16px 可避免 iOS 自動放大 */
    color: var(--text);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 9px;
  }
  input::placeholder { color: #7a7a7a; }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    transition: filter .15s, transform .06s, opacity .15s;
  }
  .btn:active:not(:disabled) { transform: scale(.985); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-save  { background: var(--green); color: #fff; }
  .btn-nav   { background: var(--blue);  color: #fff; }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    font-size: 14px;
    font-weight: 600;
    padding: 11px;
  }

  #status {
    min-height: 1.4em;
    margin: 10px 2px 18px;
    font-size: 14px;
    text-align: center;
    color: var(--muted);
  }
  #status[data-type="ok"]      { color: var(--green); }
  #status[data-type="warn"]    { color: var(--amber); }
  #status[data-type="err"]     { color: var(--red); }
  #status[data-type="loading"] { color: var(--blue); }

  .info-row {
    display: flex;
    gap: 10px;
    padding: 7px 0;
    font-size: 15px;
    border-bottom: 1px dashed rgba(255, 255, 255, .07);
  }
  .info-row:last-child { border-bottom: none; }
  .info-key { flex: 0 0 auto; min-width: 3.2em; color: var(--muted); }
  .info-val { flex: 1; word-break: break-word; }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
  }
  .actions .btn-nav { grid-column: 1 / -1; }

  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

  <h1 class="title">🚗 極速記車位</h1>

  <section class="card">
    <p class="label" id="floorLabel">樓層 / 區域</p>
    <div class="floor-grid" id="floorGrid" role="group" aria-labelledby="floorLabel"></div>

    <label class="label" for="noteInput">備註</label>
    <input id="noteInput" type="text" maxlength="60" autocomplete="off"
           enterkeyhint="done" placeholder="例如：柱子編號 B-12、靠電梯">
  </section>

  <button id="saveBtn" class="btn btn-save" type="button">📍 記錄目前位置</button>
  <p id="status" role="status" aria-live="polite">尚未記錄</p>

  <section class="card" id="savedCard" hidden>
    <h2 class="card-title">上次停放資訊</h2>
    <div id="savedInfo"></div>
    <div class="actions">
      <button id="navBtn"  class="btn btn-nav"   type="button">🗺️ 導航回車上</button>
      <button id="copyBtn" class="btn btn-ghost" type="button">📋 複製座標</button>
      <button id="clearBtn" class="btn btn-ghost" type="button">🗑️ 清除紀錄</button>
    </div>
  </section>

<script>
(function () {
  'use strict';

  /* ============ 常數 ============ */
  const KEY        = 'parking_loc_v2';
  const LEGACY_KEY = 'parking_loc';      // 舊版資料，自動搬移
  const FLOOR_KEY  = 'parking_floor';    // 記住上次選的樓層
  const DRAFT_KEY  = 'parking_note_draft';
  const FLOORS     = ['B3', 'B2', 'B1', '1F'];

  /* ============ DOM ============ */
  const floorGrid = document.getElementById('floorGrid');
  const noteInput = document.getElementById('noteInput');
  const saveBtn   = document.getElementById('saveBtn');
  const statusEl  = document.getElementById('status');
  const savedCard = document.getElementById('savedCard');
  const savedInfo = document.getElementById('savedInfo');
  const navBtn    = document.getElementById('navBtn');
  const copyBtn   = document.getElementById('copyBtn');
  const clearBtn  = document.getElementById('clearBtn');

  /* ============ 狀態 ============ */
  let selectedFloor = 'B1';
  let current = null;   // { lat, lng, accuracy, floor, note, ts }

  /* ============ localStorage 安全包裝（無痕模式可能拋錯） ============ */
  function readStore(key) {
    try { return JSON.parse(localStorage.getItem(key)); }
    catch (e) { return null; }
  }
  function writeStore(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }
  function removeStore(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  /* ============ 樓層 ============ */
  function buildFloors() {
    const frag = document.createDocumentFragment();
    FLOORS.forEach(function (f) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'floor-btn';
      b.dataset.floor = f;
      b.textContent = f;
      frag.appendChild(b);
    });
    floorGrid.appendChild(frag);
  }

  function setFloor(floor) {
    selectedFloor = floor;
    writeStore(FLOOR_KEY, floor);
    Array.prototype.forEach.call(floorGrid.children, function (btn) {
      const on = btn.dataset.floor === floor;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-pressed', String(on));
    });
  }

  /* ============ 狀態列 ============ */
  function setStatus(msg, type) {
    statusEl.textContent = msg;
    if (type) statusEl.dataset.type = type;
    else statusEl.removeAttribute('data-type');
  }

  /* ============ 定位 ============ */
  function getPosition(options) {
    return new Promise(function (resolve, reject) {
      if (!('geolocation' in navigator)) { reject({ code: 0 }); return; }
      navigator.geolocation.getCurrentPosition(resolve, reject, options);
    });
  }

  function geoErrorText(err) {
    const code = err && err.code;
    if (code === 1) return '❌ 未允許定位權限，請至瀏覽器設定開啟';
    if (code === 2) return '❌ 目前無法取得定位（訊號不佳）';
    if (code === 3) return '❌ 定位逾時，請再試一次';
    return '❌ 此裝置或瀏覽器不支援定位';
  }

  /* ============ 寫入紀錄 ============ */
  function commit(extra) {
    const data = Object.assign({
      floor: selectedFloor,
      note: noteInput.value.trim(),
      ts: Date.now()
    }, extra);

    writeStore(KEY, data);
    current = data;
    render(data);
  }

  function saveLocation() {
    if (saveBtn.disabled) return;
    saveBtn.disabled = true;
    saveBtn.textContent = '定位中…';
    setStatus('正在取得 GPS 定位…', 'loading');

    getPosition({ enableHighAccuracy: true, timeout: 10000, maximumAge: 0 })
      .then(function (pos) {
        const accuracy = Math.round(pos.coords.accuracy || 0);
        commit({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: accuracy
        });
        setStatus(
          accuracy > 100
            ? '✅ 記錄成功（GPS 精度約 ±' + accuracy + ' 公尺）'
            : '✅ 記錄成功！',
          accuracy > 100 ? 'warn' : 'ok'
        );
      })
      .catch(function (err) {
        const msg = geoErrorText(err);
        const fallback = window.confirm(msg + '\n\n是否只記錄樓層與備註（不含座標）？');
        if (fallback) {
          commit({ lat: null, lng: null, accuracy: null });
          setStatus('✅ 已記錄（無座標，無法導航）', 'warn');
        } else {
          setStatus(msg, 'err');
        }
      })
      .finally(function () {
        saveBtn.disabled = false;
        saveBtn.textContent = '📍 記錄目前位置';
      });
  }

  /* ============ 畫面渲染（全部使用 textContent，避免 XSS） ============ */
  function makeRow(label, value) {
    const row = document.createElement('div');
    row.className = 'info-row';

    const k = document.createElement('span');
    k.className = 'info-key';
    k.textContent = label;

    const v = document.createElement('span');
    v.className = 'info-val';
    v.textContent = value;

    row.append(k, v);
    return row;
  }

  const timeFmt = new Intl.DateTimeFormat('zh-TW', {
    month: 'numeric', day: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: false
  });

  function formatTime(ts) {
    if (!ts) return '未知';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '未知';

    const diffMin = Math.floor((Date.now() - ts) / 60000);
    const rel =
      diffMin < 1    ? '剛剛' :
      diffMin < 60   ? diffMin + ' 分鐘前' :
      diffMin < 1440 ? Math.floor(diffMin / 60) + ' 小時前' : '';

    return timeFmt.format(d) + (rel ? '（' + rel + '）' : '');
  }

  function render(data) {
    if (!data) { savedCard.hidden = true; return; }

    savedCard.hidden = false;

    const hasCoords = typeof data.lat === 'number' && typeof data.lng === 'number';

    savedInfo.replaceChildren(
      makeRow('樓層', data.floor || '未指定'),
      makeRow('備註', data.note || '無'),
      makeRow('時間', formatTime(data.ts)),
      makeRow('精度', hasCoords && data.accuracy != null
        ? '±' + data.accuracy + ' 公尺' : '—')
    );

    navBtn.disabled  = !hasCoords;
    copyBtn.disabled = !hasCoords;
  }

  /* ============ 導航 / 複製 / 清除 ============ */
  function openNav() {
    if (!current || current.lat == null || current.lng == null) {
      setStatus('沒有可用的座標紀錄', 'err');
      return;
    }
    const dest = current.lat + ',' + current.lng;
    const url = 'https://www.google.com/maps/dir/?api=1'
              + '&destination=' + encodeURIComponent(dest)
              + '&travelmode=walking';
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  function copyCoords() {
    if (!current || current.lat == null) return;
    const text = current.lat + ', ' + current.lng;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () { setStatus('📋 已複製座標：' + text, 'ok'); })
        .catch(function () { setStatus('複製失敗，座標：' + text, 'warn'); });
    } else {
      setStatus('座標：' + text, '');
    }
  }

  function clearRecord() {
    if (!window.confirm('確定要清除停車紀錄嗎？')) return;
    removeStore(KEY);
    current = null;
    render(null);
    setStatus('已清除紀錄', '');
  }

  /* ============ 舊資料搬移 ============ */
  function migrateLegacy() {
    const old = readStore(LEGACY_KEY);
    if (!old || typeof old.lat !== 'number' || typeof old.lng !== 'number') return null;

    const data = {
      lat: old.lat,
      lng: old.lng,
      accuracy: null,
      floor: old.floor || 'B1',
      note: old.note || '',
      ts: Date.now()
    };
    writeStore(KEY, data);
    removeStore(LEGACY_KEY);
    return data;
  }

  /* ============ 初始化 ============ */
  function init() {
    buildFloors();

    const savedFloor = readStore(FLOOR_KEY);
    setFloor(FLOORS.indexOf(savedFloor) > -1 ? savedFloor : 'B1');

    const saved = readStore(KEY) || migrateLegacy();

    if (saved) {
      current = saved;
      render(saved);
      setStatus('已載入上次紀錄', '');
    } else {
      setStatus('尚未記錄', '');
    }

    // 備註草稿優先，其次帶入上次紀錄的備註
    const draft = readStore(DRAFT_KEY);
    if (typeof draft === 'string' && draft) noteInput.value = draft;
    else if (saved && saved.note) noteInput.value = saved.note;

    /* --- 事件綁定 --- */
    floorGrid.addEventListener('click', function (e) {
      const btn = e.target.closest('.floor-btn');
      if (btn) setFloor(btn.dataset.floor);
    });

    saveBtn.addEventListener('click', saveLocation);
    navBtn.addEventListener('click', openNav);
    copyBtn.addEventListener('click', copyCoords);
    clearBtn.addEventListener('click', clearRecord);

    noteInput.addEventListener('input', function () {
      writeStore(DRAFT_KEY, noteInput.value);
    });

    noteInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); noteInput.blur(); saveLocation(); }
    });
  }

  init();
})();
</script>
</body>
</html>
